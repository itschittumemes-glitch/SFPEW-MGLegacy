name: Build MGLegacy plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the .so files are there
        run: |
          echo "Repo contents:"
          find . -name "*.so" -not -path "./.git/*"
          echo "Expected folder:"
          ls -la app/src/main/jniLibs/arm64-v8a/ || true
          test -n "$(ls app/src/main/jniLibs/arm64-v8a/*.so 2>/dev/null)" || (echo "ERROR: no .so files in app/src/main/jniLibs/arm64-v8a/" && exit 1)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MGLegacy-apk
          path: app/build/outputs/apk/debug/*.apk
